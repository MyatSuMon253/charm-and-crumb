<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <!-- Rounded clip -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="400" height="280" rx="24"/>
    </clipPath>
    <!-- Brown chain gradient -->
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5a46"/>
      <stop offset="50%" stop-color="#514236"/>
      <stop offset="100%" stop-color="#3d3228"/>
    </linearGradient>
    <!-- Matcha green -->
    <linearGradient id="matchaGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8cb86b"/>
      <stop offset="100%" stop-color="#6a9a4a"/>
    </linearGradient>
    <!-- Croissant golden -->
    <linearGradient id="croissantGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b84a"/>
      <stop offset="100%" stop-color="#c49030"/>
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clipped content -->
  <g clip-path="url(#roundedClip)">

  <!-- === CHARM BRACELET CHAIN === -->
  <!-- Main curved chain arc -->
  <path d="M 50 90 Q 120 25 200 20 Q 280 25 350 90"
        fill="none" stroke="url(#chainGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Chain links only where charms attach -->
  <g fill="none" stroke="#514236" stroke-width="2.5" stroke-linecap="round">
    <ellipse cx="120" cy="50" rx="6" ry="4" transform="rotate(-14, 120, 50)"/>
    <ellipse cx="200" cy="27" rx="6" ry="4"/>
    <ellipse cx="280" cy="50" rx="6" ry="4" transform="rotate(14, 280, 50)"/>
  </g>

  <!-- Clasp at the left end -->
  <circle cx="48" cy="92" r="6" fill="none" stroke="#514236" stroke-width="2.5"/>
  <line x1="42" y1="92" x2="38" y2="92" stroke="#514236" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === 3 CHARMS HANGING FROM CHAIN === -->
  <g filter="url(#softGlow)">

    <!-- CHARM 1: Chocolate Chip Cookie (left) -->
    <g transform="translate(120, 55)">
      <circle cx="0" cy="-5" r="4" fill="none" stroke="#514236" stroke-width="2"/>
      <!-- Cookie base -->
      <ellipse cx="0" cy="16" rx="20" ry="18" fill="#d4a574" stroke="#a07040" stroke-width="1"/>
      <!-- Cookie edge bumps -->
      <circle cx="-16" cy="10" r="3" fill="#c4945a"/>
      <circle cx="16" cy="10" r="3" fill="#c4945a"/>
      <circle cx="-14" cy="22" r="3" fill="#c4945a"/>
      <circle cx="14" cy="22" r="3" fill="#c4945a"/>
      <circle cx="0" cy="4" r="2.5" fill="#c4945a"/>
      <circle cx="-8" cy="28" r="2.5" fill="#c4945a"/>
      <circle cx="8" cy="28" r="2.5" fill="#c4945a"/>
      <!-- Chocolate chips -->
      <ellipse cx="-7" cy="10" rx="3.5" ry="3" fill="#4a2f20" transform="rotate(-15, -7, 10)"/>
      <ellipse cx="5" cy="7" rx="3" ry="2.5" fill="#5c3d2e" transform="rotate(20, 5, 7)"/>
      <ellipse cx="-3" cy="20" rx="3" ry="2.8" fill="#4a2f20" transform="rotate(10, -3, 20)"/>
      <ellipse cx="9" cy="18" rx="3.2" ry="2.5" fill="#5c3d2e"/>
      <ellipse cx="-11" cy="19" rx="2.5" ry="2.2" fill="#4a2f20" transform="rotate(-20, -11, 19)"/>
      <ellipse cx="2" cy="13" rx="2.8" ry="2.2" fill="#5c3d2e" transform="rotate(30, 2, 13)"/>
    </g>

    <!-- CHARM 2: Matcha Bowl (center) -->
    <g transform="translate(200, 32)">
      <circle cx="0" cy="-5" r="4" fill="none" stroke="#514236" stroke-width="2"/>
      <!-- Wooden saucer -->
      <ellipse cx="0" cy="28" rx="22" ry="6" fill="#8b6540" stroke="#6b4a2a" stroke-width="1"/>
      <ellipse cx="0" cy="26" rx="20" ry="5" fill="#a07050"/>
      <!-- Bowl body -->
      <path d="M -16 10 Q -18 24 -14 26 L 14 26 Q 18 24 16 10 Z"
            fill="#f5f0e8" stroke="#d4c8b8" stroke-width="1"/>
      <!-- Bowl rim -->
      <ellipse cx="0" cy="10" rx="16" ry="5" fill="#faf6f0" stroke="#d4c8b8" stroke-width="1"/>
      <!-- Matcha liquid -->
      <ellipse cx="0" cy="10" rx="13" ry="4" fill="url(#matchaGreen)" stroke="#5a8a3a" stroke-width="0.5"/>
      <!-- Matcha foam details -->
      <ellipse cx="-4" cy="9" rx="3" ry="1.5" fill="#9ac87a" opacity="0.6"/>
      <ellipse cx="3" cy="11" rx="2.5" ry="1" fill="#9ac87a" opacity="0.5"/>
      <!-- Steam wisps -->
      <path d="M -3 2 Q -2 -4 0 -2 Q 2 -6 1 0" fill="none" stroke="#d4c8b8" stroke-width="0.8" opacity="0.5"/>
      <path d="M 4 3 Q 5 -2 3 -1 Q 5 -5 4 1" fill="none" stroke="#d4c8b8" stroke-width="0.8" opacity="0.4"/>
    </g>

    <!-- CHARM 3: Croissant (right) -->
    <g transform="translate(280, 55)">
      <circle cx="0" cy="-5" r="4" fill="none" stroke="#514236" stroke-width="2"/>
      <!-- Croissant body - crescent shape -->
      <path d="M -22 16 Q -24 8 -18 2 Q -12 -4 -4 -2 Q 4 0 10 -2 Q 18 -4 22 2 Q 26 8 22 16 Q 18 22 10 20 Q 2 18 -6 20 Q -16 22 -22 16 Z"
            fill="url(#croissantGold)" stroke="#a07020" stroke-width="1"/>
      <!-- Layer segments -->
      <path d="M -16 8 Q -8 4 0 8 Q 8 4 16 8" fill="none" stroke="#c49030" stroke-width="1.2"/>
      <path d="M -18 14 Q -10 10 0 14 Q 10 10 18 14" fill="none" stroke="#c49030" stroke-width="1"/>
      <path d="M -14 18 Q -6 15 2 18" fill="none" stroke="#c49030" stroke-width="0.8"/>
      <!-- Highlight -->
      <path d="M -12 4 Q -4 0 4 4" fill="none" stroke="#e8c86a" stroke-width="1.5" opacity="0.5"/>
      <!-- Golden sheen spots -->
      <ellipse cx="-8" cy="6" rx="3" ry="2" fill="#e8c86a" opacity="0.4"/>
      <ellipse cx="6" cy="4" rx="2.5" ry="1.5" fill="#e8c86a" opacity="0.3"/>
    </g>

  </g>

  <!-- === BRAND TEXT === -->
  <text x="200" y="145" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold"
        fill="#514236" letter-spacing="2">
    Charm
  </text>
  <text x="200" y="172" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic"
        fill="#9a705f">
    &amp;
  </text>
  <text x="200" y="200" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold"
        fill="#514236" letter-spacing="2">
    Crumb
  </text>

  <!-- Small decorative crumbs around text -->
  <circle cx="130" cy="165" r="2" fill="#d4a574" opacity="0.5"/>
  <circle cx="125" cy="155" r="1.5" fill="#d4a574" opacity="0.4"/>
  <circle cx="270" cy="165" r="2" fill="#d4a574" opacity="0.5"/>
  <circle cx="275" cy="155" r="1.5" fill="#d4a574" opacity="0.4"/>
  <circle cx="135" cy="175" r="1.2" fill="#c4945a" opacity="0.3"/>
  <circle cx="265" cy="175" r="1.2" fill="#c4945a" opacity="0.3"/>

  </g>
</svg>
